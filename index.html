<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Landing Page -->
    <div id="landingPage" class="landing-page">
        <div class="landing-container">
            <header class="landing-header">
                <h1 class="game-title">BREAKOUT</h1>
                <p class="game-subtitle">Classic Breakout Game</p>
            </header>

            <section class="landing-content">
                <!-- About Section -->
                <div class="about-section">
                    <h2>About</h2>
                    <p>Welcome to Breakout! A classic brick-breaking arcade game. Control the paddle to bounce the ball and destroy all the bricks. Don't let the ball fall!</p>
                    <button class="play-button" onclick="startGame()">Play Game</button>
                </div>

                <!-- Leaderboard Section -->
                <div class="leaderboard-section">
                    <h2>Leaderboard</h2>
                    <div class="leaderboard-table">
                        <div class="leaderboard-header">
                            <span class="rank">Rank</span>
                            <span class="player">Player</span>
                            <span class="score">Score</span>
                        </div>
                        <div id="leaderboardList" class="leaderboard-list">
                            <!-- Leaderboard entries will be populated here -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Game Page -->
    <div id="gamePage" class="game-page" hidden>
        <button class="back-button" onclick="backToLanding()">← Back to Landing</button>
        <button class="settings-button" onclick="openSettings()">⚙ Settings</button>
        <div class="game-wrapper">
            <div class="score-display">Score: <span id="score">0</span></div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div class="game-over" id="gameOver" hidden>GAME OVER</div>
        </div>
    </div>

    <!-- Settings Panel Modal -->
    <div id="settingsModal" class="settings-modal" hidden>
        <div class="settings-panel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-button" onclick="closeSettings()">&times;</button>
            </div>
            <div class="settings-content">
                <div class="settings-item">
                    <label for="nicknameInput">Player Nickname:</label>
                    <input type="text" id="nicknameInput" class="settings-input" placeholder="Enter your nickname" maxlength="20">
                </div>
                <div class="settings-item">
                    <label for="soundToggle">
                        <input type="checkbox" id="soundToggle" class="settings-checkbox">
                        Enable Sound Effects
                    </label>
                </div>
            </div>
            <div class="settings-footer">
                <button class="save-button" onclick="saveSettings()">Save</button>
                <button class="cancel-button" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
